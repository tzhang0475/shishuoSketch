    context: 其宜右軍遂稱疾去郡以憤慨致終王東亭與孝伯語後漸異孝伯謂東亭曰卿便不可復測荅曰王陵廷争陳平從黙但問克終云何耳王孝伯死縣其首於大桁司馬太傅命駕出至標所孰視首曰卿何故趣欲殺我邪桓玄將篡⟦{{SKchar|3129}}⟧脩欲因⟦{{SKchar|2593}}⟧在脩母許襲之⟦{{SKchar|2928}}⟧夫人云汝等近過我餘年我養之不忍見行此事世說新語下卷下刻世說新語序吳郡袁褧撰嘗攷載記所述晉人話言簡約玄澹爾雅有韻世言江左善淸談今閱新語信乎其言之也臨川撰爲此書採掇綜叙明畼不繁孝標所注能收錄諸家小史分釋其義詁訓之賞見於高似孫緯略余家藏宋本是放翁校刋本謝湖躬耕之暇毛披心寄自謂可觀爰付梓人傳之同好因嘆昔人論司馬氏之祚亡於淸談斯言也無乃過甚矣乎竹林之儔希慕沂樂䔵亭之集咏歌堯風陶荆州之勤敏謝東山之恬鎭解莊易則輔嗣平叔擅其宗析⟦{{SKchar|3133}}⟧言則道林法深領其乗或詞冷而趣遠或事⟦{{SKchar|1216}}⟧而意奧風旨各殊人有興託王⟦{{SKchar|3561}}⟧弘祖士雅之流才通氣峻心翼王室又斑斑載諸册簡是可非之者哉詩不云乎濟濟多士文王以寧余以琅琊王之渡江諸賢弘賛之力爲多非强說也夫諸晤言率遇藻裁遂爲終身品目故⟦{{SKchar|3841}}⟧以標格相高玄虚成習一時雅尚有東京㕑俊之流風焉然曠達拓落濫觴莫拯取譏世敎撫卷惜之此於諸賢不無遺憾焉耳矣刻成序之歳立秋日也世說新語目錄上卷德行言語上卷政事文學中卷方正雅量識鑒中卷賞譽品藻規箴捷悟夙惠豪爽下卷容止自新企羡傷逝棲逸賢媛術解巧藝寵禮任誕簡傲下卷排調輕詆假譎黜免儉嗇汰汐忿狷䜛險尤悔紕漏惑溺⟦{{SKchar|2631}}⟧隟世說新語目錄宋臨川王義慶采擷漢晉以來佳事佳話爲世說新語極爲精絶而猶未爲奇也梁劉孝標注此書引援詳確有不言之妙如引漢魏吳諸史及子傳地理之書皆不必言只如晉氏一朝史及晉諸公列傳譜錄文章凡一百六十六家皆岀於正史之外紀載特詳聞見未接寔爲注書之法右世⟦{{SKchar|3664}}⟧三十六篇世所傳⟦{{SKchar|3325}}⟧爲十卷或作四十五篇而末卷但重出前九卷中所載余家舊藏葢得之王原叔家後得晏元獻公手自校本盡去重復其注亦小加剪截最爲善本㬜人雅尚清談唐初史臣脩書率意竄㝎多非舊語尚頼此書以傳後世然字有譌舛語有難解以它書證之間有可是正處而注亦比晏本時爲增損至於所疑則不敢⟦{{SKchar|2836}}⟧下雌黄姑亦傳疑以竢通博夏四月癸亥廣川董弅題郡中舊有南史劉賔客集版皆廢于火世說亦不復在㳺到官始重刻之以存故事世說最後成因併識于卷末重五日新定郡守笠澤陸游書⟦{{SKchar|2902}}⟧吴郡袁氏嘉趣坣重雕世說新語校語宋本每半葉十行行十九字目錄作德行一言語二皆平行卷首款式如左世說新語上之上宋臨川王義慶撰梁劉孝標注郭林宗袁宏雖淸易挹也李元禮風格秀整有文武㑺才李元禮嘗歎荀淑鍾皓定陵陳稺叔後進之士分爲二提行起陳太丘持杖後從鯤華歆嚴若朝典管寧王朗臘之明日爲祝歳王祥使祥晝視鳥雀夜則趍鼠王戎云嵇本姓溪王戎和嶠王隠晉書曰梁王趙王梁孝王彤王戎云太保居在正始中理中淸遠王安豐遭艱毀濬不形王里父渾渾字長原有才望郗公翼爲剡縣顧榮在洛陽乃割炙以噉之周鎭罷臨川郡鎭淸約寡欲鄧攸以牛馬負妻子以叛王長豫丞相還臺及未行嘗不送至車後桓常侍父頴累遷散騎常侍以業慈淸淨朗縣東二百里𡵙山中庾公卽復害其生謝太傅父治武昌太守晉簡文意色不說仁聞有智度范宣人寧可使婦無㡓耶王僕射旣憂慽在貎桓南郡鮑季禮企生揮泣曰吳道助附子兄弟有貪泉邊文禮見袁奉高堯德末彰嶽至今不緫也孔文舉年十歲父宙泰世都尉輒引小者嘗與儀周旋乎孔文舉有二子偷那得行禮孔融被收安有巢覆而卵不破者太祖收寘法焉荀慈明與汝南袁閬相見依據者何經祁奚爲中軍尉禰衡乃今錄爲鼓吏南郡龐士元引士元爲軍帥中郎將但末遇耳劉公幹使楨隨侍太子鍾毓持此欲安歸乎何平叔云無所事任嵇中散先君嘗謂之曰雌鳴六鄧艾口喫嵇中散旣被誅其進止無不同不慮家之有無晉武帝始登阼字安宇各是一物所以爲主也滿奮畏風作琉璃屛諸葛靚在吳如斯諸名士共至洛水戲父又北平將軍樂令女樂令旣允朝望中朝有小兒故光武嘗謂景丹曰大將軍反病瘧耳庾公造周伯仁汝南賁泰淵通淸操之士伯仁將祛舊風過江諸人使稅之君蓋歸之顧司空吳郡劉琨以有殊勳乃知帝王自有貞也郗太尉拜司空語同坐曰上問揚雄李尋對曰高坐道人尸黎密冢曰高坐摯瞻太守故以此答敦第五琦佛圖澄開棺無屍陶公疾篤劉弘鎭沔南臨書振腕張玄之被親故泣不被親故不泣臥北首顧悅經霜彌茂臣蒲柳之質簡文入華林園覺鳥獸禽魚莊周釣在濮水曰願以境內累莊子吾亦寧曳尾於塗中支道林沈思道行冷然獨暢羊秉秉羣從父率禮相承劉尹云王微王氏譜曰劉眞長就劉宿王右軍衛商鞅諸庶孽子所著詩賦誄頌王中郎祖東海太守丞於陵仲子荀中郎荀羨字全則謝公云怪怖其言猶河漢而無極也支公好鶴鑿北阬山晉武帝玄答有辭致也袁彥伯魏中郎令煥孫綽賦遂初高柔字也桓征西目曰王子敬聞公哀孝武王混摘句王子敬云從山陰道上行摧榦竦條司馬太傅齋中夜坐重明秀有才會桓玄義興還後丈夫豈可以此事語人邪桓玄旣纂位當時殊忤旨謝靈運好戴曲柄笠以罪伏誅子修心守眞賀太傅並歷美官山公以器重朝望父曜寃句令賈充充起家爲尙書遷廷尉山司徒性高朗而率至累啓亮可爲左丞相非選官才王丞相網密刑峻少有悟者丞相嘗夏月至石頭然三捉三治陶公性檢厲又好督勸於人何驃騎作會稽欲白斷常客若得門庭山陰人也弿字道眞王劉與林公應對玄言王大王大甚以爲佳殷仲堪王東亭問曰鄭玄在馬融門下少而好間鄭玄欲注春秋傳鄭玄家奴婢皆讀書鍾會旣定便回急走何平叔注老子自然出拔過之何晏注老子但應諾諾遂不復注裴成公爲世名論初注莊子者數十家此書詎復須注太傅主簿阮宣子王裴弟子悉集鴻臚丞差有祿卿常無食衞玠始度江言必入眞舊云王丞相過江左麝食柏而香豈惟蒸之使重殷中軍爲庾公長史桓宣武語人曰殷中軍見佛經云浮屠者劉眞長與殷淵源談公輸般爲高雲梯宣武集諸名勝講易動靜有爲有北來道人上人常是逆風家莊子逍遙篇歷太常護國將軍尺鷃之起楡枋則同於大通矣殷中軍殷中軍雖思慮通長便苦湯池鐵城王逸少作會稽卿欲見不三乘佛家滯義方便則止行六度許椽及於法師並在會稽王脩小字也流淸舉熙乃歎曰殷謝諸人共集色閒則無空明則不能見彼謝有問殷無答殷中軍導則俱絕有相之流張憑舉孝廉及同舉者共笑之支道林謝顧謂諸人曲終而招子貢善談玄速殷中軍孫安國亦覺殊不及向僧意在瓦官寺中意謂王曰殷中軍被廢七覺之聲殷荆州曾問遠公誦鑒淹遠鐘王臨之女字英彥提婆初至爲東亭第符堅文帝漉敊以爲汁魏朝封晉文王爲公故怡退左太冲遭人而間武帝借其書二車劉伶沛鄴人以宇宙爲狹嘗與俗士相悟衢行無轍迹行則操巵執瓢奮髯箕踞習鑿齒出爲衡陽郡不推吳楚也孫興公云作文大治袁虎少貧辭文藻拔桓宣武北征殊可觀王孝伯至其弟王睹户前桓玄嘗登江陵城文多不盡載郭淮淮在關中三十餘年諸葛亮穎川徐元⟦{{SKchar2|32}}⟧夏侯玄此人尤能以通家少年遇我爲今史責人邪夏侯泰初無騫諤風高貴鄕公昭垂涕問陳泰曰和嶠語嶠曰東官文武之阼武帝語和嶠曰常山王况以天下之廣杜預拜鎭南將軍羊穉舒晉武帝時然得去晉紀山公大兒著短帢雄有器識向雄鄭玄曰爲兵主求攻代盧志見一麞然已見父手迹使歔歎無辭爲三日畢還見崔崔曰府君見人盌鬼魅又作充貎甥羊忱父繇車騎掾王太尉庾卿之不置元皇帝旣登阼以阿帝旨周叔治奴好自愛周伯仁刀協勃海敗至江南敗死明帝在西堂敦仗勇士路戎等因欲殺之蘇峻三千餘家庾公臨去瓜衍之田吾獲狄田蘇子高事平仕人膾截耳梅頤少好學而求實進止頤弟陶及侃將蒞廣州何次道盛明之世孔君平回謝之孫興公太和劉簡嘗聽記父挻阮光祿旣時爲會稽羅君章棗陽韓康伯五大司馬王文度爲桓公長史時惡見文度已復癡畏桓溫面王子敬歌者吹律太極殿始成魏阼縣橙上題之王恭虨張玄孰視嵇中散固不與無以淸潔王道夏候太初衣服焦然陪列於松柏下王戎爲侍中乃發口詔曰裴叔則以相婚黨裴遐遐正戲鎭壽陽王夷甫與裴景聲聞善人自謂理構多如王丞相主簿几案間事祖士少范陽遒人佔奪鄕里先人田地地主多恨許侍中不得快孰禇公於牽安令沈充爲縣令欲食䴵不郄鑒字子房庾太尉三師敗績王劭必有入禍謝太傅盤桓東山時太傅神情方玉桓公伏甲晉阼存亡弗能及明公何有命部左右支道林還東郄嘉賓謝公與人圍棋氏賊符堅十萬頭匹王子猷子敬不惶取屐符堅游魂近境王僧彌汝故是吳興溪中釣碣耳王珉謝玄王東亭公甚欲其爲人太元末至央星太元末曹公少時嚴明有才略何晏而復私讐也勸嘏結交云晉武帝講武息役弭兵無所標明潘陽仲見王敦與滔同潦雄勇好騎射豪傑勒手不能書衞玠年五歲傳嘏極貴重之張季鷹翰以疾歸府王平子志大其量王大將軍始下父淮冀州刺吏王大將軍旣亡必興愍惻以父名會武昌孟嘉子孫家焉戴安道王長史見之王仲祖殊有确然之志桓公將伐蜀三峽未易可克縣軍深入郗超與謝玄氏人也徤韓康伯與謝玄績晉陽秋郗超與傅瑗周旋在光祿大大夫車胤父夏月則練囊陳仲舉嘗歎曰嘗作常謝子微召功曹公孫度避地遼東王濬或裴叔則鐘會異之王戎目山巨源而其器亦入道山公舉阮咸爲散騎侍郎王戎目阮文業河淸太守王戎云太尉當可活不王汝南少所優濶加博措閑雅張華見褚陶作鷗鳥水硾二賦吳歸命世祖有問秀才吳舊姓何如陸士衡士龍容貎瓖偉衛伯玉猶廓雲霧而覩靑天王大尉大尉王夷甫吾等皆煩太傅府凝而禦之邈淸才也中之上止此宋本連林下諸賢以下爲一卷林下諸賢劉漠太傅東海王貞淑平粹十年日幼學明謝幼輿曰太始初到洛下會秋泉後胡當入洛劉琨稱祖車騎虞預晉書曰逖字士穉則中宵起坐天未欲滅寇王大將軍殊未有得卞令目叔向叔向羊舌盼也王敦爲大將軍當復絕倒王平子微王丞相云距戰不宜住拜王丞相招祖約頭鬢未理亦小倦王大將軍殊爲陵遲年二十有七世目揚朗淮仲庾公爲護軍有似廨署何次道字建寧杜弘治丹陽世目杜弘治淸標令上也有人目杜弘治標解甚淸盛德之風蕭中郎孫丞公丞會稽孔沈桀劉尹每稱王長史云篤義穆族不修小潔林公謂王右軍云謝太傅爲桓公司馬共語至瞑欽其盛名桓宣武表云入贊百揆世目謝尙招悟令上也王劉聽林公講濛云聽講許玄度稽叔夜簡文云至故有局陳爲一則初字提行起慕容晉乃分僧衆上勝可投法汰以十二卒劉尹先推謝鎭西謝後雅重劉人問王長史江虨簡文云劉尹打吳四姓舊目云謝車騎問謝公况眞長子謝公領中書監向見阿瓜正是使人不能已王詢王子敬弘雅有氣王恭而慮弗見令司馬太傅沈烈汝南陳仲舉劉叔朱寓劉佑龐士元至吳或問如所自爲勝耶周瑜領南郡琮字子黃顧劭覽倚仗之要害諸葛瑾弟亮時人謂諸葛因爲氏後有當不冀州剌史楊淮淮劉令言始入洛納叢王夷甫云閭丘冲不能虧損王夷甫以王東海比樂令江左名士博王大將軍在西朝時若斯儌狠囗言不然也王丞相二弟敝宋禕未詳宋禕王丞相辟王藍田爲掾然曠澹處郗司空家有傖奴簡私暱罕交遊時人共論晉武帝必舉朝會之不可撫軍問孫興公劉眞長曰淸易令達桓大司馬下都克復舊京桓公問孔西陽故乃勝也謝公與時賢共賞字茂重未之達也謝萬壽春敗後失士卒情失士衆之爲便向還南劉尹謂謝仁祖曰非奔走也王右軍問許玄度何如安石謝公云金谷中魚池士窟孫興公許玄度俱與負俗之談袁彥伯爲吏部郎郄嘉賓王子猷子敬兄弟歸成都後居貧王孝伯道謝公王孝伯問謝公桓玄爲太傅何如卿第七叔京房與漢元帝今治也亂也遂以房爲東郡孫皓問丞相陸凱曰不敢加誅也何宴鄧颺頃夢靑蠅鴟鴞食桑椹位重山岳見不談也大網羅永寧曠中懷王夷甫婦高尙人郗太尉晚節詣丞相丞相翹須蘇峻東征沈充將至吳密勑左右斬首於京都字功高小庾在荆州時若有斯言王右軍與王敬仁議更克王大語東亭卿民有㑺才並有名聲出珣右遠公在廬山中遂託空崖魏武嘗過曹娥碑下存其父尸曰何晏七歲其時泰宜祿韓康伯數歲兒云已足王大將軍年少時王大將軍自目高朗疎率王處仲每酒後轍詠老驥伏櫪晉明帝欲起池臺好養武士王大將軍始欲下都處分樹置庾穉恭然後議其所任耳雅有三志每以門第威重⟦{{SKchar2|32}}⟧指魏趙軍陳林道在西岸年一十有六魏武將見匈奴使魏□曰裴令公目王安豐目甚淸炤有人詣王太尉仕至修武令石頭事故求救陶公庾太尉使吏因便據胡床劉尹道桓公皆祿胙不終王敬倫持儀操也王長史步入尙書著公服簡文作相自然湛若神君舉止端詳周處年少時乃自吳戴淵少時狀見處士戴淵企羨第十六王右軍太原孫丞公等孫子荆孫曰諸君不死而令武子死乎顧彥先張季膺庾文康靈□志支道林喪法䖍郗嘉賓喪超年四十一王子猶子敬子敬子敬人琴俱亡阮步兵論五帝三王之義孔車騎游散名山南陽劉驎之縁道以乞窮乏去道近南陽翟道淵徵國子博士孟萬年絕人間之事康僧淵在豫章加已處之怡然郗超故不果遺陳嬰者嬰母見之漢元帝單于求朝昭君恚怒之趙母其况惡乎以諫作列女傳解許允爲晉景王所誅回遑不定允有正情王經笑而謂曰于寶山公與嵇阮君才致殊不如賈充前婦且郭槐彊狠陶公少有大志侃父丹娶新淦湛氏女陶公少時䱹常有飮限庾玉臺請溫有宥王右軍郗夫人傾筐倒屐荀勗善解音律鐘鼓金石絲竹旣鑄律管王武子武帝問杜預晋明帝靑鳥子郭景純永嘉中巧藝第二十一彈棋始自魏宮內用妝奩戲典論常自敍曰顧長康好寫起人形愷之圖寫特妙王珣郗超超爲人多須珣狀短小阮籍遭母喪加性仁孝劉伶恆縱酒阮公鄰家婦往哭盡哀而去阮籍當葬母⟦{{SKchar2|32}}⟧言窮矣阮仲容步兵詣阮庭中阮步兵喪母㫄若無人若裴公之制弔阮渾長成竹林諸賢之凧雖高阮仲容旣發定將去阮宣子常步行脩性簡仕山季倫蔆茨覆水張季鷹獨不爲身後名耶溫公喜慢語溫發口鄙穢王劉初尙辭然已無歸意桓宣武少家貧略無慊吝倜儻不羈有異才桓車騎路經陽岐村王子猷見有𣰅㲪襄陽羅友爲人有記功從桓宣武平蜀至日乃往友字它仁不擇士庶又好伺人祠桓溫常責之溫雖以才學遇之溫爲席起別首且出門民始怖終漸甚爲吏吏所安張驎酒後周勁以吹簫樂喪王衞軍云王䉕已見王長史恭使司馬劉牢之討廞廞敗王戎弱冠與戎酬酢終日鍾士季精有才理有人說鍛者嵇康與呂安善安字中悌謝公神氣傲邁逆呼太傅安曰王子敬自會稽經吳不足齒人傖耳晉武帝上汝一桮酒頭責秦子羽或謇喫無宮商則當如許由子威廓然離欲不閒禮義今欲使吾爲忠也欲使吾爲信也而以蟣蝨同情而猶文采可觀拳局剪蹙王渾與婦倫字太冲荀鳴鶴陸士龍張令其語諸葛令王丞相諸葛恢王公與朝士所以爲寶耳許文思取杭上新衣褚季野僕又茸之以蠶室張吳興張應聲答曰庾園郝隆爲桓公南蠻參軍罰酒三升袁羊嘗詣劉恢唐詩曰郗重熙郗曇王脩已見王子猷詣謝萬林公意甚惡郗司空拜北府以愛僧爲評也王文度說字上有一一字劉遵祖庾公甚忻然二郗奉道唯讀佛經營治寺廟而已矣范榮期何必勞神苦形所解數千牛祖廣行恆縮頭父台之仕光禄大夫輕詆二十六庾元規鍾離舂者折腰出胷庾公權重此爲金火相樂金陵本治王丞相輕蔡公蔡邕孫也吾昔與安期千里高柔在東淸婉辛切簡文與許玄度諸人紛葩謝萬壽春敗後故王嘉萬也庾道季甚不以爲好毛物牡牝之不知魏武行役軍皆渴魏武常言王大將軍旣爲逆居店賣食王右軍年減十歲乃剔吐孰眠方意右軍未起陶公陶又自要起同坐坐定溫公喪婦左司馬都督上前鋒諸軍事王文度弟阿智那得至今末有婚處䖍當以護軍起之故來迎之諸葛玄詣檻車與別桓公入蜀巫峽長猿鳴鄧竟陵因免遐官貿甑何儋殷仲文遂伏誅衞江州非弘範也郗公大聚斂卓犖而不羈王君夫有牛相牛經曰牛經出甯戚傳𩀱筋白尾骨屬頸其亦有陰虹也疎肋難齡齠王武子齊與從兄恬不平石崇毎與王敦史紀曰王令多矜咳王大王恭初桓石民爲荆州鎭上時上朋少時袁悅王粲聞其說孝武甚親敬王國寶王雅尤梅第三十三魏文帝我黃須兒可用也陸平原河橋敗劉琨抗行淵勒王大將軍視近日之言王導溫嶠胙安得長溫公初受其令入坐議庾公欲起周子南大丈夫乃爲庾元規所賣阮思曠奉大法必當蒙祐豈可以言神明之智者哉謝太傅於東船行或遲或速桓車騎在上明政獵元皇截一賀頭是誰蔡司徒渡江皆入足二螯讀爾雅不孰也謝虎子尙書襃第二子王大喪後而夜開閣魏甄后熙出在幽州見甄怖遂納之有玉荀奉倩粲不明於是力顧賈公閣後妻郭氏知后無子甚憂愛王丞相雷有寵生恬洽劉璵令作阬阬畢遊權貴之間王大將軍執司馬愍王相州剌史乃馳檄諸郡丞赴義應鎭南所謂入質之士襃與相景共免之王孝伯孰視首曰遺左將軍謝琰⟦{{SKchar|3129}}⟧玄將纂⟦{{SKchar|2989}}⟧沖後娶穎川庾蔑世說新語下卷下傳是樓宋槧本是刋於湘中者有江原張縯跋一篇舊爲南園俞氏藏書有耕雲俞彥春跋上粘王履約還書簡帖書法極古雅紙墨氣亦絕佳未知放翁所刋原本視此何如也吾友蔣篁亭並有對校本考正尤多四月雨牕校畢時館南城王氏淸蔭堂之左廂巖識二月得此本於玉峯書肆閏月從黃蕘圃假得沈寳硯校本用朱筆過校凡七日長洲吳嘉泰春生甫志于露凝書屋世說新語著錄家以明嘉靖中袁氏嘉趣堂本爲最善涵芬樓得一校本蓋沈寶硯以傳是樓宋本校袁本而嘉慶甲戌吳春生過錄者也袁本有戊申新定郡守陸遊跋則重開放翁本也傳是本沈跋云以刊於湘中有江原張縯跋兩本同出於宋玩其字句均以傳是本爲長袁刻遇宋諱多闕筆於明人翻刻本已爲謹嚴而不免貽誤是知書以舊本爲佳一經重刻遂不可恃錄其校語綴於卷末以爲讀是書者之助焉庚申十月無錫孫毓修識
