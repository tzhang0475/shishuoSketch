      (者皆宗歸之/老易故風流)

      劉尹每稱王長史云性至通而自然有節(濛之交物/濛别傳曰)

      (不敬而愛之然少孤事諸母甚謹篤義穆族不脩小/虛巳納善恕而後行希見其喜愠之色凡與一面莫)

      (貧見稱/潔以清)

      王右軍道謝萬石在林澤中爲自遒上歎林公器朗

      神儁(心獨往風期高亮/支遁别傳曰遁任)道祖士少風領'
