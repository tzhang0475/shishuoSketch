      (數年後方卒寳因作&KR0679;神記中云有所感起是也/接寢恩情如生家中吉凶輙語之校之悉驗平復)劉

      曰卿可謂鬼之董狐(園趙宣子未出境而復太史書/春秋傳曰趙穿攻晉靈公於桃)

      (反不討賊非子而誰孔子曰董狐古之良史也書法/趙盾弑其君宣子曰不然對曰子為正卿亡不越境)

      (大夫也為法受惡/不隱趙盾古之賢)

      許文思徃顧和許顧先在帳中眠許至便徑就牀角

