    opening_text: "孫秀既恨石崇不與緑珠(緑珠美而工笛孫秀使人/干寳晉紀曰石崇有妓人)\n(出其婢妾數十人以示之曰任所以擇使者曰本受/求之崇别館北邙下方登涼觀臨清水使者以告崇)\n(可得也使者曰君侯博古知今察逺照邇願加三思/命者指緑珠也未識孰是崇勃然曰緑珠吾所愛不)\n(又反崇竟不許/崇不然使者已出)又憾"
