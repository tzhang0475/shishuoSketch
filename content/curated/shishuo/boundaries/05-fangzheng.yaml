    opening_text: "諸葛亮之次渭濵闗中震動(陽都人客于荆州躬耕/蜀志曰亮字孔明琅邪)\n(之許也唯博陵崔州平潁川徐元直謂爲信然先主/隴畝好爲梁甫吟長八尺每自比管仲樂毅時人莫)\n(見之乎先主曰君與俱來庶曰此人可就見不可屈/屯新野徐庶見先主曰諸葛孔明臥龍也將軍豈願)\n(之有水也累遷丞相益州牧率衆北征卒於渭南/致也先主遂詣亮謂闗羽張飛曰孤之有孔明猶魚)\n魏"
