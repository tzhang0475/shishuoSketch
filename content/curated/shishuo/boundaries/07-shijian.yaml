    opening_text: "石勒不知書(之苗裔也雄勇好騎射晉元康中流宕/石勒傳曰勒字世龍上黨武鄉人匈奴)\n(音勒私異之初勒鄉里原上地中生石且長類鐵騎/山東與平原茌平人師歡家庸耳恒聞鼓角鞞鐸之)\n(胡體貌竒異有不可知勸邑人厚遇之人多哂而不/之象國中生人參葩葉甚盛于時父老相者皆云此)\n(左前督桑敗共推勒爲主攻下州縣都於㐮國後僣/信永嘉初豪傑並起與胡王陽等十八騎詣汲桑爲)\n(明皇帝/正號死謚)使人讀漢書聞酈"
